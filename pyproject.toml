[project]
name = "shinsen-arsenal-data"
version = "1.0.0"
description = "『信長の野望 真戦』武将帳の公開データ取得・正規化・検証ツール"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "pillow>=10.0",
    "pykakasi>=2.3",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
