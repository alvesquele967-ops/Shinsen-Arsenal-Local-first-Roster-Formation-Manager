name: 品質検査

on:
  push:
  pull_request:

jobs:
  test:
    name: 型・データ・単体テスト・ビルド
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
      - name: Node.js を準備
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: 依存パッケージを準備
        run: |
          npm ci
          python -m pip install -r requirements.txt
      - name: 公開データを検査
        run: npm run data:check
      - name: TypeScript を検査
        run: npm run typecheck
      - name: フロントエンド単体テスト
        run: npm test
      - name: Python テスト
        run: npm run test:python
      - name: 本番ビルド
        run: npm run build

  e2e:
    name: ブラウザ操作テスト
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
      - name: Node.js を準備
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 依存パッケージを準備
        run: npm ci
      - name: Chromium を準備
        run: npx playwright install --with-deps chromium
      - name: E2Eテスト
        run: npm run test:e2e
